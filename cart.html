<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Cart - OnlineShop</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="hdr"></div>
    <main class="wrap" id="main" style="margin-top: 12px"></main>
    <div id="ftr"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      chrome();
      function draw() {
        const c = cart.get().filter((i) => byId(i.id)),
          t = cart.totals();
        if (!c.length) {
          $("#main").innerHTML =
            '<div class="box ctr" style="padding:50px"><h2>Aapka cart khaali hai</h2><p class="g" style="margin:8px 0 16px">Kuch accha sa add karo!</p><a class="btn" href="index.html">Shop Now</a></div>';
          return;
        }
        $("#main").innerHTML =
          `<div class="two"><div class="box"><h2>My Cart (${t.n})</h2>${c
            .map((i) => {
              const p = byId(i.id);
              return `<div class="item"><a href="product.html?id=${p.id}"><img src="${p.img}" alt=""></a><div><a href="product.html?id=${p.id}"><b>${esc(p.name)}</b></a><div class="g">${esc(p.brand)}${i.size ? " · Size: " + esc(i.size) : ""}</div><div class="pr"><b>${inr(p.price)}</b> <s>${inr(p.mrp)}</s> <span class="ok">${off(p)}% off</span></div><div class="qty"><button data-a="-" data-i="${i.id}" data-s="${i.size}">−</button><span>${i.qty}</span><button data-a="+" data-i="${i.id}" data-s="${i.size}">+</button></div><button class="lnk" data-a="x" data-i="${i.id}" data-s="${i.size}">REMOVE</button></div><div class="g">Delivery by ${eta(5)}</div></div>`;
            })
            .join(
              "",
            )}<div style="text-align:right;margin-top:14px"><a class="btn" href="checkout.html">PLACE ORDER</a></div></div>
 <aside class="box sum"><h3>Price Details</h3><div class="r"><span>Price (${t.n} items)</span><span>${inr(t.mrp)}</span></div><div class="r"><span>Discount</span><span class="ok">− ${inr(t.disc)}</span></div><div class="r"><span>Delivery Charges</span><span class="${t.ship ? "" : "ok"}">${t.ship ? inr(t.ship) : "FREE"}</span></div><div class="r t"><span>Total Amount</span><span>${inr(t.total)}</span></div><p class="ok">You will save ${inr(t.disc)} on this order</p></aside></div>`;
        $$("[data-a]").forEach(
          (b) =>
            (b.onclick = () => {
              const a = b.dataset.a,
                i = b.dataset.i,
                s = b.dataset.s;
              a === "x" ? cart.del(i, s) : cart.qty(i, s, a === "+" ? 1 : -1);
              draw();
            }),
        );
      }
      draw();
    </script>
  </body>
</html>
